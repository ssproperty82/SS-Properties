name: Build SS Properties Android APK

on:
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms"
          ls "${ANDROID_HOME}/platforms"

      - name: Install JavaScript dependencies
        working-directory: mobile-app
        run: npm install --no-audit --no-fund

      - name: Check Expo dependency compatibility
        working-directory: mobile-app
        run: npx expo install --check

      - name: Generate native Android project
        working-directory: mobile-app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release-variant APK
        working-directory: mobile-app/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify JavaScript bundle is packaged
        working-directory: mobile-app/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|assets/index\.android\.bundle\.hbc'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ss-properties-android-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
