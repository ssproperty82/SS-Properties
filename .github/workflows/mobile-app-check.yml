name: Expo mobile app checks

on:
  push:
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-app-check.yml"
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-app-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript and Expo checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install dependencies
        working-directory: mobile-app
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        working-directory: mobile-app
        run: npx expo install --check
      - name: Type-check the app
        working-directory: mobile-app
        run: npm run typecheck
      - name: Run Expo project diagnostics
        working-directory: mobile-app
        run: npx expo-doctor
